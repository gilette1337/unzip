<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zip Extractor & Auto Downloader</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e293b;
    --fg: #e2e8f0;
    --accent: #38bdf8;
    --accent-2: #f43f5e;
  }

  * { box-sizing: border-box; }

  body {
    font-family: Arial, sans-serif;
    background:
      radial-gradient(circle at 20% 20%, rgba(56,189,248,0.18), transparent 28%),
      radial-gradient(circle at 80% 30%, rgba(244,63,94,0.14), transparent 30%),
      linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--fg);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    transition: transform 0.03s linear, filter 0.12s ease;
  }

  body.chaos-tint-a {
    filter: hue-rotate(18deg) saturate(1.25) contrast(1.08);
  }

  body.chaos-tint-b {
    filter: hue-rotate(-18deg) saturate(1.35) contrast(1.12);
  }

  #drop-zone {
    border: 3px dashed var(--accent);
    border-radius: 18px;
    padding: 50px;
    text-align: center;
    width: min(80vw, 500px);
    cursor: pointer;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    user-select: none;
    background: rgba(15, 23, 42, 0.4);
    backdrop-filter: blur(7px);
    box-shadow: 0 18px 60px rgba(0,0,0,0.35);
    transition: transform 0.07s linear, left 0.07s linear, top 0.07s linear, background 0.12s ease, border-color 0.12s ease;
    z-index: 2;
  }

  #drop-zone.dragover {
    background: rgba(30, 41, 59, 0.78);
    border-color: var(--accent-2);
  }

  #status {
    margin-top: 20px;
    color: #a5f3fc;
    font-size: 14px;
    min-height: 18px;
  }


  body.success-rumble {
    filter: hue-rotate(0deg) saturate(1.35) contrast(1.1);
  }

  body.siren-red {
    box-shadow: inset 0 0 0 100vmax rgba(255, 0, 60, 0.14);
  }

  body.siren-blue {
    box-shadow: inset 0 0 0 100vmax rgba(0, 120, 255, 0.14);
  }

  .troll-emoji {
    position: fixed;
    left: 0;
    top: 0;
    pointer-events: none;
    user-select: none;
    z-index: 9999;
    will-change: transform, opacity;
    text-shadow: 0 0 10px rgba(255,255,255,0.35);
  }

</style>
</head>
<body>
<div id="drop-zone">
  <h2>Drag & Drop your .zip file here</h2>
  <p>or click to select manually</p>
  <input type="file" id="file-input" accept=".zip" hidden>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  const statusText = document.getElementById('status');

  let shakeTimer = null;
  let tintTimer = null;
  let moveTimer = null;
  let runawayActive = false;
  let zoneX = window.innerWidth / 2;
  let zoneY = window.innerHeight / 2;
  let zoneRot = 0;
  let spin = 0;
  let sirenTimer = null;
  let successShakeTimer = null;
  let emojiSpawner = null;
  let activeEmoji = new Set();

  function applyZoneTransform(scale = 1) {
    dropZone.style.left = `${zoneX}px`;
    dropZone.style.top = `${zoneY}px`;
    dropZone.style.transform = `translate(-50%, -50%) rotate(${zoneRot}deg) scale(${scale})`;
  }

  function clampZone() {
    const marginX = Math.min(180, window.innerWidth * 0.2);
    const marginY = Math.min(140, window.innerHeight * 0.18);
    zoneX = Math.max(marginX, Math.min(window.innerWidth - marginX, zoneX));
    zoneY = Math.max(marginY, Math.min(window.innerHeight - marginY, zoneY));
  }

  function startScreenShake() {
    if (shakeTimer) return;
    shakeTimer = setInterval(() => {
      const x = (Math.random() - 0.5) * 42;
      const y = (Math.random() - 0.5) * 42;
      const rot = (Math.random() - 0.5) * 3.2;
      document.body.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
    }, 18);
  }

  function stopScreenShake() {
    clearInterval(shakeTimer);
    shakeTimer = null;
    document.body.style.transform = 'translate(0, 0) rotate(0deg)';
  }

  function startTintChaos() {
    if (tintTimer) return;
    let mode = 0;
    tintTimer = setInterval(() => {
      mode = (mode + 1) % 3;
      document.body.classList.remove('chaos-tint-a', 'chaos-tint-b');
      if (mode === 1) document.body.classList.add('chaos-tint-a');
      if (mode === 2) document.body.classList.add('chaos-tint-b');
    }, 220);
  }

  function stopTintChaos() {
    clearInterval(tintTimer);
    tintTimer = null;
    document.body.classList.remove('chaos-tint-a', 'chaos-tint-b');
  }

  function startMovingDropZone() {
    if (moveTimer) return;
    moveTimer = setInterval(() => {
      zoneX += (Math.random() - 0.5) * 180;
      zoneY += (Math.random() - 0.5) * 140;
      spin += (Math.random() - 0.5) * 24;
      zoneRot = Math.max(-18, Math.min(18, spin));
      clampZone();
      applyZoneTransform(1 + Math.random() * 0.08);
    }, 65);
  }

  function stopMovingDropZone() {
    clearInterval(moveTimer);
    moveTimer = null;
    zoneX = window.innerWidth / 2;
    zoneY = window.innerHeight / 2;
    zoneRot = 0;
    spin = 0;
    applyZoneTransform(1);
  }


  function startHeavySuccessQuake(duration = 3200) {
    stopHeavySuccessQuake();
    let started = performance.now();
    successShakeTimer = setInterval(() => {
      const elapsed = performance.now() - started;
      const decay = Math.max(0.35, 1 - elapsed / duration);
      const x = (Math.random() - 0.5) * 120 * decay;
      const y = (Math.random() - 0.5) * 120 * decay;
      const rot = (Math.random() - 0.5) * 8 * decay;
      const skewX = (Math.random() - 0.5) * 4 * decay;
      const skewY = (Math.random() - 0.5) * 4 * decay;
      document.body.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) skew(${skewX}deg, ${skewY}deg)`;
    }, 14);
    document.body.classList.add('success-rumble');
    setTimeout(stopHeavySuccessQuake, duration);
  }

  function stopHeavySuccessQuake() {
    clearInterval(successShakeTimer);
    successShakeTimer = null;
    document.body.classList.remove('success-rumble');
    if (!shakeTimer) {
      document.body.style.transform = 'translate(0, 0) rotate(0deg)';
    }
  }

  function startSirenPulse(duration = 3200) {
    stopSirenPulse();
    let mode = 0;
    sirenTimer = setInterval(() => {
      mode = (mode + 1) % 2;
      document.body.classList.remove('siren-red', 'siren-blue');
      document.body.classList.add(mode === 0 ? 'siren-red' : 'siren-blue');
    }, 280);
    setTimeout(stopSirenPulse, duration);
  }

  function stopSirenPulse() {
    clearInterval(sirenTimer);
    sirenTimer = null;
    document.body.classList.remove('siren-red', 'siren-blue');
  }

  function spawnEmojiBurst(count = 90, duration = 3200) {
    stopEmojiBurst();
    const endAt = performance.now() + duration;

    function makeOne() {
      const el = document.createElement('div');
      el.className = 'troll-emoji';
      el.textContent = 'wok';
      const size = 18 + Math.random() * 38;
      const x = Math.random() * window.innerWidth;
      const y = Math.random() * window.innerHeight;
      const vx = (Math.random() - 0.5) * 34;
      const vy = (Math.random() - 0.5) * 34;
      const spin = (Math.random() - 0.5) * 28;
      const scale = 0.85 + Math.random() * 1.5;
      let px = x;
      let py = y;
      let rot = Math.random() * 360;
      el.style.fontSize = `${size}px`;
      el.style.opacity = '0.95';
      document.body.appendChild(el);
      activeEmoji.add(el);

      let last = performance.now();
      function tick(now) {
        if (!activeEmoji.has(el)) return;
        const dt = Math.min(32, now - last) / 16.67;
        last = now;
        px += vx * dt;
        py += vy * dt;
        rot += spin * dt;

        if (px < -80) px = window.innerWidth + 40;
        if (px > window.innerWidth + 80) px = -40;
        if (py < -80) py = window.innerHeight + 40;
        if (py > window.innerHeight + 80) py = -40;

        const lifeLeft = Math.max(0, endAt - now);
        const opacity = Math.min(0.95, lifeLeft / 700);
        el.style.opacity = String(opacity);
        el.style.transform = `translate(${px}px, ${py}px) rotate(${rot}deg) scale(${scale})`;

        if (now < endAt) {
          requestAnimationFrame(tick);
        } else {
          activeEmoji.delete(el);
          el.remove();
        }
      }
      requestAnimationFrame(tick);
    }

    for (let i = 0; i < count; i++) makeOne();
    emojiSpawner = setInterval(() => {
      for (let i = 0; i < 16; i++) makeOne();
    }, 220);
    setTimeout(stopEmojiBurst, duration);
  }

  function stopEmojiBurst() {
    clearInterval(emojiSpawner);
    emojiSpawner = null;
    for (const el of activeEmoji) el.remove();
    activeEmoji.clear();
  }

  function startSuccessTrollBurst() {
    startHeavySuccessQuake(3200);
    startSirenPulse(3200);
    spawnEmojiBurst(120, 3400);
  }

  function startUiTroll() {
    startScreenShake();
    startTintChaos();
    startMovingDropZone();
  }

  function stopUiTroll() {
    stopScreenShake();
    stopTintChaos();
    stopMovingDropZone();
  }

  function repelFromPointer(clientX, clientY) {
    const dx = zoneX - clientX;
    const dy = zoneY - clientY;
    const dist = Math.hypot(dx, dy) || 1;
    const force = Math.max(120, 420 - dist);
    zoneX += (dx / dist) * force * 0.22;
    zoneY += (dy / dist) * force * 0.22;
    zoneRot += (Math.random() - 0.5) * 22;
    zoneRot = Math.max(-28, Math.min(28, zoneRot));
    clampZone();
    applyZoneTransform(1.04);
  }

  dropZone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });

  document.addEventListener('dragover', e => {
    e.preventDefault();
    if (!runawayActive) return;
    repelFromPointer(e.clientX, e.clientY);
  });

  document.addEventListener('dragenter', e => {
    if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
      runawayActive = true;
      statusText.textContent = '😈 Catch the drop zone first...';
    }
  });

  document.addEventListener('drop', () => {
    runawayActive = false;
  });

  document.addEventListener('dragend', () => {
    runawayActive = false;
  });

  window.addEventListener('resize', () => {
    clampZone();
    applyZoneTransform(1);
  });

  async function handleFiles(files) {
    if (!files.length) return;
    const file = files[0];
    if (!file.name.endsWith('.zip')) {
      statusText.textContent = '❌ Please upload a .zip file only.';
      return;
    }

    runawayActive = false;
    statusText.textContent = `📦 Reading ${file.name}...`;
    startUiTroll();

    const zip = new JSZip();

    try {
      const data = await file.arrayBuffer();
      const loadedZip = await zip.loadAsync(data);
      const filesList = Object.keys(loadedZip.files);
      statusText.textContent = `😈 Aggressive chaos mode active... Extracting ${filesList.length} files...`;

      for (const filename of filesList) {
        const zipEntry = loadedZip.files[filename];
        if (!zipEntry.dir) {
          const content = await zipEntry.async('blob');
          const link = document.createElement('a');
          link.href = URL.createObjectURL(content);
          link.download = filename.split('/').pop();
          link.style.display = 'none';
          document.body.appendChild(link);
          link.click();
          link.remove();
          await new Promise(r => setTimeout(r, 200));
        }
      }

      statusText.textContent = '🎉 Done.';
      startSuccessTrollBurst();
    } catch (err) {
      console.error(err);
      statusText.textContent = '❌ Failed to extract zip file.';
    } finally {
      setTimeout(() => { stopUiTroll(); stopHeavySuccessQuake(); stopSirenPulse(); stopEmojiBurst(); }, 3800);
    }
  }

  applyZoneTransform(1);
</script>
</body>
</html>
